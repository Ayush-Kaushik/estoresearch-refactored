name: Java Tests, SonarQube and Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and analyze
    runs-on: ubuntu-latest

    environment: website-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build package and run all tests
        run: mvn -B clean verify surefire-report:report

      - name: Generate JaCoCo reports
        if: always()
        run: mvn -B jacoco:merge@merge-coverage jacoco:report@e2e-report jacoco:report@overall-report

      - name: Verify JaCoCo XML report exists
        run: test -f target/site/jacoco/jacoco.xml

      - name: SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Ayush-Kaushik_estoresearch-refactored
          -Dsonar.organization=Ayush-Kaushik
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/reports/
          if-no-files-found: warn

      - name: Upload behavior test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-test-report
          path: target/cucumber-report.html
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/site/jacoco-e2e/
          if-no-files-found: warn

  build:
    name: Build documentation
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-reports

      - name: Download behavior test report
        uses: actions/download-artifact@v4
        with:
          name: behavior-test-report
          path: target

      - name: Copy coverage reports into Docusaurus static files
        run: |
          test -f ../coverage-reports/jacoco/index.html
          test -f ../coverage-reports/jacoco-e2e/index.html
          mkdir -p static/coverage/e2e
          cp -a ../coverage-reports/jacoco/. static/coverage/
          cp -a ../coverage-reports/jacoco-e2e/. static/coverage/e2e/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      - name: Inspect build output
        run: |
          pwd
          ls -la
          ls -la build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-site
          path: website/build
          if-no-files-found: error

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment: website-production

    permissions:
      contents: read

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-site
          path: website/build

      - name: Inspect downloaded site
        run: |
          pwd
          ls -la website/build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}